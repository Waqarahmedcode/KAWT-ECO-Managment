[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  included_files = ["data/source-report.html", "public/brand/kawt-logo.png"]

# Netlify detects Next.js from package.json and uses its Next.js runtime.
# This source package requires a build; it is not a static drag-and-drop site.
