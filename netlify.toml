[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  included_files = ["data/source-report.html", "public/brand/kawt-logo.png"]

# Required for Git-based builds as well as local CLI deployments.
# This source package requires a build; it is not a static drag-and-drop site.
[[plugins]]
  package = "@netlify/plugin-nextjs"
